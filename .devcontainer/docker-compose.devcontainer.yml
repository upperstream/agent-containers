services:
  agents:
    build:
      args:
        CONTAINER_USER: devcontainer
        ENVIRONMENT: development
        NANO_CLASSIC_KEYBINDINGS: yes
    volumes:
      - ${CLAUDE_HOME:-$HOME/.claude}:/home/devcontainer/.claude:cached
      - ${CLINE_HOME:-$HOME/.cline}:/home/devcontainer/.cline:cached
      - ${CODEX_HOME:-$HOME/.codex}:/home/devcontainer/.codex:cached
      - ${COPILOT_HOME:-$HOME/.copilot}:/home/devcontainer/.copilot:cached
      - ${CRUSH_HOME:-$HOME/.crush}:/home/devcontainer/.crush:cached
      - ${CURSOR_HOME:-$HOME/.cursor}:/home/devcontainer/.cursor:cached
      - ${FACTORY_HOME:-$HOME/.factory}:/home/devcontainer/.factory:cached
      - ${GEMINI_HOME:-$HOME/.gemini}:/home/devcontainer/.gemini:cached
      - ${GROK_HOME:-$HOME/grok_home}:/home/devcontainer/.grok:cached
      - ${HERMES_HOME:-$HOME/.hermes}:/home/devcontainer/.hermes:cached
      - ${KILO_HOME:-$HOME/kilo}:/mnt/kilo:cached
      - ${KIRO_HOME:-$HOME/.kiro}:/home/devcontainer/.kiro:cached
      - ${OPENCLAW_HOME:-$HOME/.openclaw}:/home/devcontainer/.openclaw:cached
      - ${OPENWIKI_HOME:-$HOME/.openwiki}:/home/devcontainer/.openwiki:cached
      - /dev/null:/home/user/.claude
      - /dev/null:/home/user/.cline
      - /dev/null:/home/user/.codex
      - /dev/null:/home/user/.copilot
      - /dev/null:/home/user/.crush
      - /dev/null:/home/user/.cursor
      - /dev/null:/home/user/.factory
      - /dev/null:/home/user/.gemini
      - /dev/null:/home/user/.grok
      - /dev/null:/home/user/.hermes
      - /dev/null:/home/user/.kiro
      - /dev/null:/home/user/.openclaw
      - /dev/null:/home/user/.openwiki
      - docker_builder_socket:/run/docker-builder:ro
      - podman_builder_socket:/run/podman-builder:ro
    group_add:
      # Socket access survives Dev Container UID/GID remapping.
      - "2375"
    environment:
      # Sibling builders only; host engine sockets are not mounted.
      DOCKER_HOST: unix:///run/docker-builder/docker.sock
      CONTAINER_HOST: unix:///run/podman-builder/podman.sock
    depends_on:
      docker_builder:
        condition: service_healthy
      podman_builder:
        condition: service_healthy

  docker_builder:
    build:
      context: .
      dockerfile: .devcontainer/docker_builder.Dockerfile
    privileged: true
    cgroup: host
    volumes:
      - docker_builder_data:/var/lib/docker
      - docker_builder_socket:/run/docker-builder
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(stat -c '%a:%g' /run/docker-builder/docker.sock)"
          = '660:2375' &&
          curl -fsS --unix-socket /run/docker-builder/docker.sock
          http://localhost/_ping
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  podman_builder:
    build:
      context: .
      dockerfile: .devcontainer/podman_builder.Dockerfile
    privileged: true
    cgroup: host
    devices:
      - /dev/fuse
    volumes:
      - podman_builder_data:/var/lib/containers
      - podman_builder_socket:/run/podman-builder
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(stat -c '%a:%g' /run/podman-builder/podman.sock)"
          = '660:2375' &&
          curl -fsS --unix-socket /run/podman-builder/podman.sock
          http://localhost/libpod/_ping
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  docker_builder_data:
  podman_builder_data:
  docker_builder_socket:
  podman_builder_socket:
